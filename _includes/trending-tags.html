<!-- Topics across posts, projects, and dashboards, ranked by page count. -->
{% if site.data.trending_topic_tags.size > 0 %}
  <section>
    <h2 class="panel-heading">{{ site.data.locales[include.lang].panel.trending_tags }}</h2>
    <div class="d-flex flex-wrap mt-3 mb-1 me-3">
      {% for tag in site.data.trending_topic_tags %}
        {% assign tag_url = tag | slugify | url_encode | prepend: '/tags/' | append: '/' %}
        <a class="post-tag btn btn-outline-primary" href="{{ tag_url | relative_url }}">{{ tag | escape }}</a>
      {% endfor %}
    </div>
  </section>
{% endif %}
