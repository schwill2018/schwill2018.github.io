---
layout: page
---

{% include lang.html %}

<div id="page-tag">
  <h1 class="ps-lg-2">
    <i class="fa fa-tag fa-fw text-muted" aria-hidden="true"></i>
    {{ page.title | escape }}
    <span class="lead text-muted ps-2">{{ page.posts | size }}</span>
  </h1>
  <ul class="content ps-0">
    {% for item in page.posts %}
      <li class="d-flex justify-content-between px-md-3">
        <a href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
        <span class="dash flex-grow-1"></span>
        {% if item.date %}
          {% include datetime.html date=item.date class='text-muted small text-nowrap' lang=lang %}
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>
