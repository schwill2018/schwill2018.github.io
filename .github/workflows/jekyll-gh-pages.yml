name: Build & Deploy Jekyll (Pages)

on:
  push:
    branches: [schwill2018-patch-chirpy]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update NFL Elo Page"]
    types: [completed]
    branches: [schwill2018-patch-chirpy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Include the page committed by the completed NFL Elo workflow.
          ref: schwill2018-patch-chirpy

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: bundle install --path vendor/bundle

      - name: Build Jekyll
        run: bundle exec jekyll build -d _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
