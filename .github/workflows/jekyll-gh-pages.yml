name: Build & Deploy Jekyll (Pages)
on:
  push:
    branches: [schwill2018-patch-chirpy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: bundle install --path vendor/bundle

      - name: Build Jekyll with secret override
        env:
          GOOGLE_SITE_ID: ${{ secrets.GOOGLE_SITE_ID }}
        run: |
          printf "webmaster_verifications:\n  google: %s\n" "$GOOGLE_SITE_ID" > _config.secret.yml
          bundle exec jekyll build --config _config.yml,_config.secret.yml -d _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
