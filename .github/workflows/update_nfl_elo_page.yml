name: Update NFL Elo Page

on:
  # Run after the NFL Elo repository's daily update.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-elo-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the published portfolio branch
        uses: actions/checkout@v7
        with:
          ref: schwill2018-patch-chirpy
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the NFL Elo pages and performance data
        env:
          NFL_RANKINGS_URL: https://raw.githubusercontent.com/schwill2018/nfl_elo_project/HEAD/current_elo_rankings.csv
          NFL_WEEKLY_URL: https://raw.githubusercontent.com/schwill2018/nfl_elo_project/HEAD/weekly_projections.csv
          NFL_PERFORMANCE_URL: https://raw.githubusercontent.com/schwill2018/nfl_elo_project/HEAD/performance_games.csv
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          import urllib.request
          from pathlib import Path

          division_map = {
              "BUF": "AFC East", "MIA": "AFC East", "NE": "AFC East", "NYJ": "AFC East",
              "BAL": "AFC North", "CIN": "AFC North", "CLE": "AFC North", "PIT": "AFC North",
              "HOU": "AFC South", "IND": "AFC South", "JAX": "AFC South", "TEN": "AFC South",
              "DEN": "AFC West", "KC": "AFC West", "LV": "AFC West", "LAC": "AFC West",
              "DAL": "NFC East", "NYG": "NFC East", "PHI": "NFC East", "WAS": "NFC East",
              "CHI": "NFC North", "DET": "NFC North", "GB": "NFC North", "MIN": "NFC North",
              "ATL": "NFC South", "CAR": "NFC South", "NO": "NFC South", "TB": "NFC South",
              "ARI": "NFC West", "LA": "NFC West", "SF": "NFC West", "SEA": "NFC West",
          }

          with urllib.request.urlopen(os.environ["NFL_RANKINGS_URL"], timeout=30) as response:
              text = response.read().decode("utf-8-sig")

          rows = list(csv.DictReader(io.StringIO(text)))
          if not rows:
              raise SystemExit("The NFL rankings CSV was empty.")

          required = {"rank", "team", "elo"}
          missing = required - set(rows[0])
          if missing:
              raise SystemExit(f"The NFL rankings CSV is missing columns: {sorted(missing)}")

          rows.sort(key=lambda row: int(float(row["rank"])))

          with urllib.request.urlopen(os.environ["NFL_WEEKLY_URL"], timeout=30) as response:
              weekly_text = response.read().decode("utf-8-sig")

          weekly_reader = csv.DictReader(io.StringIO(weekly_text))
          weekly_required = {
              "as_of_date", "week", "gameday", "away_team", "home_team",
              "away_elo", "home_elo", "p_away", "p_home", "outcome",
          }
          weekly_missing = weekly_required - set(weekly_reader.fieldnames or [])
          if weekly_missing:
              raise SystemExit(f"The weekly projections CSV is missing columns: {sorted(weekly_missing)}")

          weekly_rows = list(weekly_reader)
          weekly_rows.sort(key=lambda row: (row["gameday"], row.get("gametime", "")))

          with urllib.request.urlopen(os.environ["NFL_PERFORMANCE_URL"], timeout=30) as response:
              performance_text = response.read().decode("utf-8-sig")

          performance_reader = csv.DictReader(io.StringIO(performance_text))
          performance_required = {
              "season", "week", "game_id", "gameday", "away_team", "home_team",
              "p_home", "actual_home_win", "evaluation_type",
          }
          performance_missing = performance_required - set(performance_reader.fieldnames or [])
          if performance_missing:
              raise SystemExit(
                  f"The performance games CSV is missing columns: {sorted(performance_missing)}"
              )

          performance_rows = list(performance_reader)
          if not performance_rows:
              raise SystemExit("The performance games CSV was empty.")

          allowed_evaluation_types = {"historical", "deployed"}
          unexpected_evaluation_types = {
              row["evaluation_type"] for row in performance_rows
              if row["evaluation_type"] not in allowed_evaluation_types
          }
          if unexpected_evaluation_types:
              raise SystemExit(
                  "The performance games CSV has unexpected evaluation_type values: "
                  f"{sorted(unexpected_evaluation_types)}"
              )

          def clean(value):
              return str(value or "").replace("|", "\\|").replace("\n", " ").strip()

          # Display-only formatting: underlying CSVs and calculations are unchanged.
          def elo_display(value):
            return f"{float(value):.2f}"

          as_of_date = clean(rows[0].get("as_of_date")) or "latest available update"
          lines = [
              "---",
              "layout: page",
              "title: NFL Elo",
              "icon: fas fa-football-ball",
              "order: 7",
              "categories: [sports]",
              "tags: [ELO, forecasting, football]",
              "---",
              "",
              f"Current NFL Elo rankings as of **{as_of_date}**.",
              "",
              "| Rank | Team | Elo | Conference | Division |",
              "| ---: | --- | ---: | --- | --- |",
          ]

          for row in rows:
              team = clean(row["team"])
              division = clean(row.get("division")) or division_map.get(team, "")
              conference = clean(row.get("conference")) or division[:3]
              lines.append(
                  f"| {clean(row['rank'])} | {team} | {elo_display(row['elo'])} | "
                  f"{conference} | {division} |"
              )

          lines.extend(["", "## Weekly Predictions", ""])
          if weekly_rows:
              week = clean(weekly_rows[0]["week"])
              weekly_date = clean(weekly_rows[0]["as_of_date"])
              lines.extend([
                  f"NFL Week {week}: forecasts as of **{weekly_date}**.",
                  "",
                  "| Date | Away | Home | Away Elo | Home Elo | Away Win Probability | Home Win Probability | Outcome |",
                  "| --- | --- | --- | ---: | ---: | ---: | ---: | --- |",
              ])
              for row in weekly_rows:
                  lines.append(
                      f"| {clean(row['gameday'])} | {clean(row['away_team'])} | "
                      f"{clean(row['home_team'])} | {elo_display(row['away_elo'])} | "
                      f"{elo_display(row['home_elo'])} | "
                      f"{float(row['p_away']):.1%} | {float(row['p_home']):.1%} | "
                      f"{clean(row['outcome'])} |"
                  )
          else:
              lines.append("No weekly projections are currently available.")

          lines.extend([
              "",
              "[View model performance]({% link _tabs/nfl-elo-performance.md %})",
              "",
              "[Click here to get the data](https://raw.githubusercontent.com/schwill2018/nfl_elo_project/HEAD/nfl_elo_history.csv)",
          ])

          Path("_tabs").mkdir(exist_ok=True)
          Path("_tabs/nfl-elo.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          performance_path = Path("assets/data/nfl-elo/performance_games.csv")
          performance_path.parent.mkdir(parents=True, exist_ok=True)
          performance_path.write_text(performance_text, encoding="utf-8")
          PY

      - name: Commit the updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tabs/nfl-elo.md _tabs/nfl-elo-performance.md assets/data/nfl-elo/performance_games.csv
          if git diff --cached --quiet; then
            echo "No NFL Elo page changes to save."
            exit 0
          fi
          git commit -m "Update NFL Elo pages and performance data"
          git push origin HEAD:schwill2018-patch-chirpy
